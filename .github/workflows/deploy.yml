name: CI/CD Pipeline - Job Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: job-portal

jobs:
  # ─────────────────────────────────────────────
  # 1. Build & Test & Push Docker Image to ECR
  # ─────────────────────────────────────────────
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run tests
        run: gradle test
        working-directory: backend

      - name: Build with Gradle (skip tests)
        run: gradle build -x test
        working-directory: backend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "### ✅ Docker Image Pushed" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # 2. Deploy to EC2 via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.1.0
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SARAMIN_API_KEY: ${{ secrets.SARAMIN_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 300s
          envs: ECR_REGISTRY,ECR_REPO,IMAGE_TAG,AWS_REGION,DB_HOST,DB_NAME,DB_USERNAME,DB_PASSWORD,SARAMIN_API_KEY
          script: |
            mkdir -p ~/scripts ~/logs
            
            # ECR 로그인
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            # Blue-Green 무중단 배포 진행
            ACTIVE_BLUE=$(docker ps --filter "name=app-blue" --filter "status=running" -q | wc -l)
            if [ "$ACTIVE_BLUE" -gt 0 ]; then
                NEW_PORT=8081
                NEW_CONTAINER="app-green"
                OLD_CONTAINER="app-blue"
            else
                NEW_PORT=8080
                NEW_CONTAINER="app-blue"
                OLD_CONTAINER="app-green"
            fi

            echo "Deploying new container $NEW_CONTAINER on port $NEW_PORT..."
            FULL_IMAGE="$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG"
            docker pull "$FULL_IMAGE"
            docker rm -f "$NEW_CONTAINER" 2>/dev/null || true

            docker run -d \
              --name "$NEW_CONTAINER" \
              --restart unless-stopped \
              -p "$NEW_PORT:8080" \
              -e DB_HOST="$DB_HOST" \
              -e DB_NAME="$DB_NAME" \
              -e DB_USERNAME="$DB_USERNAME" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -e SARAMIN_API_KEY="$SARAMIN_API_KEY" \
              "$FULL_IMAGE"

            # 헬스 체크 (최대 10회)
            HEALTHY=false
            for i in $(seq 1 10); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:$NEW_PORT/actuator/health" || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Health check passed on port $NEW_PORT!"
                HEALTHY=true
                break
              fi
              echo "Waiting for container on port $NEW_PORT... ($i/10) status: $STATUS"
              sleep 5
            done

            if [ "$HEALTHY" = "true" ]; then
              docker stop "$OLD_CONTAINER" 2>/dev/null || true
              docker rm "$OLD_CONTAINER" 2>/dev/null || true
              echo "🚀 Deployment succeeded! $NEW_CONTAINER is active on port $NEW_PORT."
            else
              echo "❌ Health check failed. Rolling back $NEW_CONTAINER."
              docker rm -f "$NEW_CONTAINER" 2>/dev/null || true
              exit 1
            fi
