name: CI/CD Pipeline - Job Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: job-portal

jobs:
  # ─────────────────────────────────────────────
  # 1. Build & Test & Push Docker Image to ECR
  # ─────────────────────────────────────────────
  build:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run tests
        run: gradle test
        working-directory: backend

      - name: Build with Gradle (skip tests)
        run: gradle build -x test
        working-directory: backend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "### ✅ Docker Image Pushed" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # 2. Deploy to EC2 via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 300s
          script: |
            mkdir -p ~/scripts ~/logs
            
            ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            ECR_REPO="${{ env.ECR_REPOSITORY }}"
            ECR_PASSWORD="${{ steps.login-ecr.outputs.docker_password }}"
            IMAGE_TAG="${{ github.sha }}"
            DB_HOST="${{ secrets.DB_HOST }}"
            DB_NAME="${{ secrets.DB_NAME }}"
            DB_USERNAME="${{ secrets.DB_USERNAME }}"
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            
            # Docker ECR Login
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY" || true

            # Determine Blue/Green Port & Container
            if docker ps --filter "name=app-blue" --filter "status=running" -q | grep -q .; then
                NEW_PORT=8081
                NEW_CONTAINER="app-green"
                OLD_CONTAINER="app-blue"
            else
                NEW_PORT=8080
                NEW_CONTAINER="app-blue"
                OLD_CONTAINER="app-green"
            fi

            echo "Deploying new container $NEW_CONTAINER on port $NEW_PORT..."
            FULL_IMAGE="$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG"
            docker pull "$FULL_IMAGE"
            
            # Clean up target container & occupied port if any
            docker rm -f "$NEW_CONTAINER" 2>/dev/null || true
            for pid in $(docker ps --filter "publish=$NEW_PORT" -q); do
                docker rm -f "$pid" 2>/dev/null || true
            done

            # Run new container
            docker run -d \
              --name "$NEW_CONTAINER" \
              --restart unless-stopped \
              -p "$NEW_PORT:8080" \
              -e DB_HOST="$DB_HOST" \
              -e DB_NAME="$DB_NAME" \
              -e DB_USERNAME="$DB_USERNAME" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              "$FULL_IMAGE"

            # Health Check
            HEALTHY=0
            for i in $(seq 1 15); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:$NEW_PORT/actuator/health" 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Health check passed on port $NEW_PORT!"
                HEALTHY=1
                break
              fi
              echo "Waiting for Spring Boot on port $NEW_PORT... ($i/15) status: $STATUS"
              sleep 5
            done

            if [ "$HEALTHY" -eq 1 ]; then
              if docker ps -a --format '{{.Names}}' | grep -q "^${OLD_CONTAINER}$"; then
                docker stop "$OLD_CONTAINER" 2>/dev/null || true
                docker rm "$OLD_CONTAINER" 2>/dev/null || true
              fi
              echo "🚀 Deployment succeeded! $NEW_CONTAINER is active on port $NEW_PORT."
              exit 0
            else
              echo "❌ Health check failed. Rolling back $NEW_CONTAINER."
              docker rm -f "$NEW_CONTAINER" 2>/dev/null || true
              exit 1
            fi
